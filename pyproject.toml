[project]
name = "comp"
version = "0.1.0"
description = "NLP competition experiments for Indonesian aspect-based sentiment analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.2.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "peft>=0.21.2",
    "protobuf>=7.36.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.3",
    "spacy>=3.8.18",
    "torch>=2.11,<2.12",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
